[package]
name = "Iter"
version = "0.1.0"
edition = "2024"
description = "A command-line time tracker for projects and tasks, with tmux session and GitHub issue integration."

[workspace]
members = ["macros"]

[features]
default = ["web"]
# `iter serve`: the local browser UI. Off for a CLI-only build.
web = ["dep:topcoat", "dep:tokio", "dep:pulldown-cmark"]

[dependencies]
iter-macros = { path = "macros" }
chrono = "0.4.37"
clap = { version = "4.5.45", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.20"
# Only what the app uses (routes, views, the server). The defaults add
# compression, cookies, sessions, fonts, assets and route discovery: about 120
# more crates (brotli, h2's codecs, tungstenite, toml, time, rand), which
# doubled a clean release build.
topcoat = { version = "0.9", optional = true, default-features = false, features = ["router", "view", "serve"] }
# Descriptions are markdown (`web/ui/prose.rs`); only its HTML writer.
pulldown-cmark = { version = "0.13.4", optional = true, default-features = false, features = ["html"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"], optional = true }

# A release rebuild reuses what did not change: most of its time is LLVM
# optimising the web views' async code, so without this every change costs
# the whole crate again (75s -> 2-27s). The binary is a little less inlined.
[profile.release]
incremental = true
