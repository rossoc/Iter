[package]
name = "iter-web"
version.workspace = true
edition.workspace = true
description = "`iter serve`: a browser UI over the database the CLI uses."

[dependencies]
iter-core.workspace = true
topcoat = { workspace = true, features = ["sse"] }
tokio = { workspace = true, features = ["time"] }
# The `/live` event stream: its type and the stream that checks the version every second.
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
pulldown-cmark.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
iter-core = { workspace = true, features = ["test-support"] }
